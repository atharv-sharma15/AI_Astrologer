version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vedviki_postgres
    restart: always
    environment:
      POSTGRES_USER: vedviki_user
      POSTGRES_PASSWORD: vedviki_secure_password
      POSTGRES_DB: vedviki_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vedviki_user -d vedviki_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vedviki_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://vedviki_user:vedviki_secure_password@db:5432/vedviki_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CHROMA_PERSIST_DIR: /app/chroma_db
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - upload_data:/app/uploads

volumes:
  pgdata:
  chroma_data:
  upload_data:
